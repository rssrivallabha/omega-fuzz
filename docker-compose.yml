version: '3.8'

services:
  omega-fuzz-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omega-fuzz-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - OMEGA_ALLOW_UNSAFE_LOCAL_EXECUTION=true
      - CAMPAIGN_RETENTION_MS=3600000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Optional Redis broker container for future scale-out execution engine
  redis-broker:
    image: redis:7-alpine
    container_name: omega-fuzz-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
